language: br

database:
  sync-interval-seconds: 0
  login-timeout-seconds: 15
  table-prefix: ""
  type: SQLITE
  mysql:
    host: 127.0.0.1
    port: 3306
    database: bancinematic
    username: root
    password: ""
    use-ssl: false
    allow-public-key-retrieval: false
    connect-timeout: 5000
    socket-timeout: 10000

cinematic:
  enabled: true
  emerge-ticks: 50
  stare-ticks: 8
  windup-ticks: 12
  attack-animation-ticks: 10
  camera-turn-delay-ticks: 6
  camera-yaw-max-step: 6.5
  camera-pitch-max-step: 3.5
  dissolve-particle: SCULK_SOUL
  dissolve-ticks: 30
  max-seconds: 15
  darkness: true
  monster:
    type: WARDEN
    scale: 3.0
    distance: 11.0
    height-offset: 0.0
    approach-speed: 0.16
    attack-distance: 3.0
  lightning-on-hit: true
  sounds: true
  particles: true
